name: CI

# Every pull request runs formatting, lint, strict types, unit and property tests,
# real PostgreSQL integration tests, and the production web build.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and property tests
        run: npm run test

      - name: Integration tests (embedded PostgreSQL 17)
        run: npm run test:integration

      - name: Build web application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
